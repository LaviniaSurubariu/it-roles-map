<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Harta meseriilor IT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: o aplicație desenată ca hartă pe straturi; fiecare strat e o familie de meserii, click deschide rolurile */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --ink:#152033; --muted:#566275; --line:#D9DFE8; --soft:#E9EDF4;
  --accent:#2A4BC4;
  --f-prod:#C0287A; --f-dev:#2A5BE0; --f-data:#7034D6; --f-infra:#B86A00; --f-qa:#08875F; --f-sec:#D02B2B; --f-arh:#4A5872;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E131B; --surface:#161D28; --ink:#E5EAF2; --muted:#9AA6B8; --line:#2A3445; --soft:#1F2836;
  --accent:#8EA6FF;
  --f-prod:#F27DB8; --f-dev:#7E9EFF; --f-data:#B79BFF; --f-infra:#F2AE4B; --f-qa:#4ED1A2; --f-sec:#FF7C7C; --f-arh:#A6B4CC;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E131B; --surface:#161D28; --ink:#E5EAF2; --muted:#9AA6B8; --line:#2A3445; --soft:#1F2836;
  --accent:#8EA6FF;
  --f-prod:#F27DB8; --f-dev:#7E9EFF; --f-data:#B79BFF; --f-infra:#F2AE4B; --f-qa:#4ED1A2; --f-sec:#FF7C7C; --f-arh:#A6B4CC;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{transition:none!important}}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;padding-inline:16px}
.wrap{max-width:1120px;margin-inline:auto}
h1,h2,h3{font-family:var(--display);line-height:1.1;text-wrap:balance;margin:0}
h2{font-size:clamp(1.7rem,3.4vw,2.4rem);font-weight:800;letter-spacing:-.01em}
h3{font-size:1.2rem;font-weight:700}
p{margin:0}
.lead{color:var(--muted);max-width:62ch;font-size:1.08rem}
.eyebrow{font-family:var(--mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* nav */
nav.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin-inline:-16px;padding:10px 16px}
nav.top .wrap{display:flex;gap:6px 18px;align-items:center;flex-wrap:wrap}
nav.top b{font-family:var(--display);font-weight:800;margin-right:auto}
nav.top a{color:var(--muted);text-decoration:none;font-size:.95rem}
nav.top a:hover{color:var(--ink)}

section{padding-block:64px;display:grid;gap:28px}
section + section{border-top:1px solid var(--line)}

/* hero */
.hero{padding-block:48px 56px;display:grid;gap:20px}
.hero h1{font-size:clamp(2.4rem,6.5vw,4.6rem);font-weight:800;letter-spacing:-.025em;max-width:16ch}
.hero h1 span{color:var(--accent)}

/* app map */
.appmap{display:grid;grid-template-columns:1fr 150px 150px;grid-template-rows:auto repeat(4,auto);gap:8px}
.band{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;text-align:left;cursor:pointer;display:grid;gap:6px;align-content:start;transition:border-color .15s, transform .15s;position:relative}
.band:hover{border-color:var(--fc);transform:translateY(-1px)}
.band[aria-pressed="true"]{border-color:var(--fc);box-shadow:0 0 0 1px var(--fc) inset}
.band .q{font-family:var(--display);font-weight:700;font-size:1.12rem;color:var(--ink)}
.band .fam{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--fc)}
.band .fam i{width:10px;height:10px;border-radius:3px;background:var(--fc);display:inline-block}
.band .ex{color:var(--muted);font-size:.95rem}
.band .n{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.b-arh{grid-column:1 / -1}
.b-prod{grid-column:1}.b-dev{grid-column:1}.b-data{grid-column:1}.b-infra{grid-column:1}
.b-qa{grid-column:2;grid-row:2 / 6}.b-sec{grid-column:3;grid-row:2 / 6}
.b-qa,.b-sec{align-content:center}
.mapnote{font-size:.92rem;color:var(--muted)}
@media (max-width:760px){
  .appmap{grid-template-columns:1fr 1fr}
  .b-arh,.b-prod,.b-dev,.b-data,.b-infra{grid-column:1 / -1}
  .b-qa{grid-column:1;grid-row:auto}.b-sec{grid-column:2;grid-row:auto}
}

/* roles */
.controls{display:grid;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row .lbl{font-weight:600;margin-right:4px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:.93rem;display:inline-flex;gap:7px;align-items:center}
.chip i{width:9px;height:9px;border-radius:3px;background:var(--fc,var(--muted))}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.status{font-size:.92rem;color:var(--muted);min-height:1.4em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;text-align:left;cursor:pointer;display:grid;gap:8px;align-content:start;transition:opacity .2s, border-color .15s}
.card:hover{border-color:var(--fc)}
.card.dim{opacity:.32}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.card .fam{font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--fc);display:flex;gap:6px;align-items:center}
.card .fam i{width:8px;height:8px;border-radius:2px;background:var(--fc)}
.card h3{font-size:1.15rem}
.card p{color:var(--muted);font-size:.96rem}
.card .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.pill{font-size:.75rem;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.up{color:var(--f-qa);border-color:color-mix(in srgb,var(--f-qa) 45%,var(--line))}
.pill.chg{color:var(--f-infra);border-color:color-mix(in srgb,var(--f-infra) 45%,var(--line))}

/* dialog */
dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);padding:0;width:min(720px,calc(100vw - 24px));max-height:calc(100dvh - 32px)}
dialog::backdrop{background:rgba(8,12,20,.55)}
.dlg{padding:24px;display:grid;gap:18px}
.dlg header{display:grid;gap:8px;padding-right:40px}
.dlg h3{font-size:1.7rem;font-weight:800}
.dlg .close{position:absolute;top:14px;right:14px;border:1px solid var(--line);background:var(--soft);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:1.1rem}
.dlg .blk{display:grid;gap:6px}
.dlg .blk h4{margin:0;font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.dlg .app{background:var(--soft);border-radius:10px;padding:12px 14px}
.tech{display:flex;flex-wrap:wrap;gap:6px}
.tech span{font-family:var(--mono);font-size:.8rem;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:3px 8px}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links button{border:1px solid var(--line);background:none;border-radius:999px;padding:4px 11px;cursor:pointer;font-size:.9rem;display:inline-flex;gap:6px;align-items:center}
.links button i{width:8px;height:8px;border-radius:2px;background:var(--fc)}
.links button:hover{border-color:var(--fc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:600px){.two{grid-template-columns:1fr}}

/* testing */
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:760px){.compare{grid-template-columns:1fr}}
.flow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:12px}
.steps{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.92rem}
.steps span{background:var(--soft);border-radius:6px;padding:4px 9px}
.steps .who-qa{background:color-mix(in srgb,var(--f-qa) 18%,var(--surface))}
.steps .who-dev{background:color-mix(in srgb,var(--f-dev) 18%,var(--surface))}
.steps em{font-style:normal;color:var(--muted)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:.96rem}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--mono);font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:500}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:600;white-space:nowrap}
.who{display:inline-block;font-size:.8rem;border-radius:999px;padding:1px 9px;margin:1px 4px 1px 0}
.who.d{background:color-mix(in srgb,var(--f-dev) 16%,var(--surface));color:var(--f-dev)}
.who.q{background:color-mix(in srgb,var(--f-qa) 16%,var(--surface));color:var(--f-qa)}
.who.s{background:color-mix(in srgb,var(--f-sec) 16%,var(--surface));color:var(--f-sec)}
.who.a{background:color-mix(in srgb,var(--f-infra) 16%,var(--surface));color:var(--f-infra)}

/* trends */
.trends{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.trend{border-top:2px solid var(--ink);padding-top:14px;display:grid;gap:8px;align-content:start}
.trend p{color:var(--muted)}
.trend .so{color:var(--ink);font-size:.95rem}

/* ladder */
.ladder{display:grid;grid-template-columns:repeat(4,1fr) 1.3fr;gap:10px;align-items:stretch}
.step{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:6px;align-content:start}
.step b{font-family:var(--display);font-size:1.1rem}
.step p{color:var(--muted);font-size:.93rem}
.step .yrs{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.fork{display:grid;gap:10px}
.fork .step{border-style:dashed}
@media (max-width:900px){.ladder{grid-template-columns:1fr 1fr}.fork{grid-column:1 / -1;grid-template-columns:1fr 1fr}}
@media (max-width:520px){.ladder,.fork{grid-template-columns:1fr}}

/* glossary */
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:4px 28px;margin:0}
.gloss div{padding-block:10px;border-bottom:1px solid var(--line);min-width:0}
.gloss dt{font-family:var(--mono);font-size:.9rem;font-weight:500}
.gloss dd{margin:2px 0 0;color:var(--muted);font-size:.95rem}
#gq{font:inherit;width:100%;max-width:360px;padding:9px 13px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}

/* start */
.tips{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;counter-reset:t}
.tip{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:6px;align-content:start}
.tip p{color:var(--muted);font-size:.95rem}
footer{padding-block:28px 48px;color:var(--muted);font-size:.88rem;border-top:1px solid var(--line)}
</style>

<style>
.pill.down{color:var(--f-sec);border-color:color-mix(in srgb,var(--f-sec) 45%,var(--line))}
.techlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.techlist li{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:12px;align-items:baseline;padding-bottom:8px;border-bottom:1px solid var(--line)}
.techlist li:last-child{border-bottom:0}
.techlist code{font-family:var(--mono);font-size:.84rem;font-weight:500}
.techlist span{color:var(--muted);font-size:.94rem}
@media (max-width:520px){.techlist li{grid-template-columns:1fr;gap:2px}}
.techcats{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
@media (max-width:420px){.techcats{grid-template-columns:1fr}}
.techcat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:12px;align-content:start;min-width:0}
.dlg .warn{background:color-mix(in srgb,var(--f-sec) 10%,var(--surface));border-radius:10px;padding:12px 14px}
.tk{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline dotted;text-decoration-color:var(--accent);text-underline-offset:3px;text-decoration-thickness:1.5px}
.tk:hover{color:var(--accent)}
#pop{position:absolute;z-index:20;width:min(320px,calc(100vw - 32px));background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 10px 30px rgba(10,15,25,.18);display:grid;gap:6px;font-size:.95rem;line-height:1.5}
#pop b{font-family:var(--mono);font-size:.9rem}
#pop p{color:var(--muted)}
.pop-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pop-x{border:0;background:var(--soft);border-radius:6px;width:26px;height:26px;cursor:pointer}
.pop-go{justify-self:start;border:0;background:none;color:var(--accent);padding:2px 0;cursor:pointer;font:inherit;font-size:.9rem}
.pop-go:hover{text-decoration:underline}
[data-term]{scroll-margin-top:90px;border-radius:6px;transition:background .3s}
.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%,40%{background:color-mix(in srgb,var(--accent) 22%,transparent)}100%{background:transparent}}
.layout{display:block}
.toc{display:none}
@media (min-width:1180px){
  .layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:48px;max-width:1400px;margin-inline:auto}
  .layout > .wrap{max-width:1120px;width:100%;margin-inline:0 auto}
  .toc{display:block;position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);align-self:start;max-height:calc(100vh - 96px);overflow-y:auto;padding-block:48px 24px}
  nav.top a{display:none}
}
.toc ol{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:2px}
.toc a{display:block;padding:4px 10px;border-left:2px solid var(--line);color:var(--muted);text-decoration:none;font-size:.92rem;line-height:1.35}
.toc a:hover{color:var(--ink)}
.toc li.on > a{color:var(--ink);border-left-color:var(--accent);font-weight:600}
.toc .sub{display:none;margin:2px 0 6px 10px}
.toc .sub a{font-size:.84rem;border-left-color:transparent;padding-block:3px}
.toc li.on > .sub{display:grid}
section[id],.techcat[id]{scroll-margin-top:80px}
.teamwrap{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.teamwrap{grid-template-columns:1fr}}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:10px}
.members{list-style:none;margin:0;padding:0;display:grid;gap:0}
.members li{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:center;padding-block:8px;border-bottom:1px solid var(--line)}
.members li:last-child{border-bottom:0}
.members span{color:var(--muted);font-size:.9rem}
@media (max-width:480px){.members li{grid-template-columns:1fr;gap:2px}}
.rchip{border:1px solid var(--line);background:none;border-radius:999px;padding:4px 11px;cursor:pointer;font-size:.92rem;display:inline-flex;gap:7px;align-items:center;justify-self:start;text-align:left}
.rchip i{width:8px;height:8px;border-radius:2px;background:var(--fc);flex:none}
.rchip:hover{border-color:var(--fc)}
.tside{display:grid;gap:12px;align-content:start;padding:4px 2px}
.tnames{display:flex;flex-wrap:wrap;gap:6px}
.tnames span{background:var(--soft);border-radius:6px;padding:4px 10px;font-size:.92rem}
.tnote{color:var(--muted);font-size:.93rem;border-top:1px solid var(--line);padding-top:12px}
.shared{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px;align-content:start}
.scard h4{margin:0;font-family:var(--display);font-size:1.05rem}
.scard p{color:var(--muted);font-size:.94rem}
.techcats{align-items:start}
details.techcat{gap:0;padding:0}
details.techcat > summary{list-style:none;cursor:pointer;padding:14px 18px;display:grid;gap:4px;border-radius:12px}
details.techcat > summary::-webkit-details-marker{display:none}
details.techcat > summary:hover{background:var(--soft)}
details.techcat .sh{display:flex;align-items:center;gap:10px}
details.techcat .sh::after{content:"+";margin-left:auto;font-family:var(--mono);font-size:1.1rem;color:var(--muted)}
details.techcat[open] .sh::after{content:"−"}
details.techcat .cnt{font-family:var(--mono);font-size:.75rem;color:var(--muted);background:var(--soft);border-radius:999px;padding:1px 8px}
details.techcat .prev{color:var(--muted);font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.techcat[open] .prev{display:none}
details.techcat > .techlist{padding:4px 18px 16px}
.sizes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.size{display:grid;grid-row:span 9;grid-template-rows:subgrid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.size-h{padding:16px 16px 12px;display:grid;gap:4px;border-bottom:1px solid var(--line);background:var(--soft)}
.size-h h3{font-size:1.25rem}
.cell{padding:12px 16px;border-bottom:1px solid var(--line);display:grid;gap:6px;align-content:start}
.cell:last-child{border-bottom:0}
.cell .asp{font-family:var(--mono);font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.cell p{font-size:.93rem;color:var(--ink)}
.cell .none{font-size:.85rem;color:var(--muted);font-style:italic}
.cell .rchip{font-size:.85rem;padding:3px 9px}
@media (max-width:860px){.sizes{grid-template-columns:1fr}.size{grid-row:auto;grid-template-rows:none}}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.9rem;color:var(--muted);align-items:center}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.lang button{border:0;background:none;padding:4px 10px;cursor:pointer;font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.toc .sub a.cur{color:var(--ink);font-weight:600;background:var(--soft);border-left:2px solid var(--accent);border-radius:0 6px 6px 0}
nav.top .wrap{flex-wrap:nowrap}
nav.top b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:5px 9px;cursor:pointer;font-size:.88rem;flex:none}
.nbtn:hover{border-color:var(--accent)}
.theme-btn .i-sun{display:none}
:root[data-theme="dark"] .theme-btn .i-sun{display:block}
:root[data-theme="dark"] .theme-btn .i-moon{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .theme-btn .i-sun{display:block}:root:not([data-theme="light"]) .theme-btn .i-moon{display:none}}
@media (min-width:1180px){.menu-btn{display:none}}
@media (max-width:1179px){
  .toc{display:block;position:fixed;top:0;bottom:0;left:0;width:min(320px,86vw);z-index:40;background:var(--surface);border-right:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 20px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);overflow-y:auto;transform:translateX(-102%);transition:transform .22s ease;visibility:hidden}
  .toc.open{transform:none;visibility:visible}
  .toc-bg{position:fixed;inset:0;z-index:39;background:rgba(8,12,20,.45)}
  .toc .sub{display:grid}

<div class="layout">
<aside class="toc" id="tocbox" aria-label="Cuprins"><p class="eyebrow">Cuprins</p><ol id="toc"></ol></aside>
<div class="wrap">

<header class="hero">
  <p class="eyebrow">Pentru cine e la început în IT</p>
  <h1>Meseriile din <span>IT</span></h1>
  <p class="lead">O prezentare a principalelor arii din IT: ce face fiecare rol, ce tehnologii folosește și cum se schimbă piața în 2026. Exemplele folosesc o aplicație de livrare de mâncare, ca să fie clar unde intervine fiecare rol.</p>
</header>

<section id="harta" style="padding-top:8px;border-top:0">
  <div style="display:grid;gap:10px">
    <h2>Ariile principale</h2>
    <p class="lead">Fiecare bloc este o arie din IT. Apasă pe unul ca să vezi rolurile din ea.</p>
  </div>
  <div class="appmap" id="appmap"></div>
  <p class="mapnote">Calitatea și securitatea sunt pe verticală pentru că se aplică tuturor celorlalte arii: se testează și se securizează atât interfața, cât și serverul și datele.</p>
</section>

<section id="roluri">
  <div style="display:grid;gap:10px">
    <h2>Rolurile</h2>
    <p class="lead">Apasă pe un rol ca să vezi ce face, cum arată munca de zi cu zi, ce tehnologii folosește (cu explicații) și cum poți începe.</p>
  </div>
  <div class="controls">
    <div class="row" id="famrow"><span class="lbl">Arie:</span></div>
    <div class="row" id="likerow"><span class="lbl">Mă interesează:</span></div>
    <div class="legend"><span>Tendință:</span><span class="pill up">în creștere</span><span class="pill">stabil</span><span class="pill chg">în schimbare</span><span class="pill down">în scădere</span></div>
    <p class="status" id="status" aria-live="polite"></p>
  </div>
  <div class="grid" id="grid"></div>
</section>

<section id="echipe">
  <div style="display:grid;gap:10px">
    <h2>Cum arată o echipă</h2>
    <p class="lead">Nu orice firmă are toate rolurile. Cu cât firma este mai mică, cu atât sunt mai puține roluri, iar munca rolurilor care lipsesc este preluată de ceilalți, de cele mai multe ori de developeri. Mărimile sunt orientative. Apasă pe un rol ca să vezi detaliile lui.</p>
  </div>
  <div class="sizes" id="sizes"></div>
  <p class="tnote" style="max-width:75ch">În firmele de outsourcing, foarte multe în România, echipa este formată pentru proiectul unui client. Poate arăta ca oricare dintre coloanele de mai sus, în funcție de contract, și uneori lucrează împreună cu oamenii clientului.</p>
</section>

<section id="scadere">
  <div style="display:grid;gap:10px">
    <p class="eyebrow">Important de știut înainte să alegi</p>
    <h2>Roluri în scădere</h2>
    <p class="lead">Unele roluri au tot mai puține posturi noi, pentru că o parte din munca lor este preluată de alte roluri sau automatizată, inclusiv cu AI. Nu dispar complet, dar intrarea în ele este mai grea, iar cerințele s-au schimbat.</p>
  </div>
  <div class="tablewrap">
    <table>
      <thead><tr><th>Rol</th><th>Ce se întâmplă</th><th>Cine preia munca</th><th>Ce poți face</th></tr></thead>
      <tbody>
        <tr><td>Tester manual</td><td>Testele repetitive sunt automatizate, iar developerii își scriu singuri testele.</td><td>Developeri, QA automation</td><td>Învață automatizare (Playwright, testare de API) și treci spre QA automation.</td></tr>
        <tr><td>UX / UI designer</td><td>Multe firme folosesc design systems gata făcute și unelte AI care generează interfețe. O parte din design o fac developerii frontend și product managerii. Posturile de junior sunt puține.</td><td>Frontend developeri, product manageri</td><td>Combină designul cu frontend sau cu user research.</td></tr>
        <tr><td>Business analyst</td><td>Cerințele sunt scrise tot mai des direct de product manager sau de developeri, iar AI-ul ajută la documentare.</td><td>Product manageri, developeri, tech leads</td><td>Specializează-te pe un domeniu (bănci, asigurări, sănătate) sau treci spre product management.</td></tr>
        <tr><td>Product owner</td><td>Rolul este comasat tot mai des cu cel de product manager.</td><td>Product manageri</td><td>Învață partea de strategie și de analiză de date a unui product manager.</td></tr>
        <tr><td>Scrum master</td><td>Echipele își organizează singure procesul, iar ce rămâne este preluat de engineering manager sau de tech lead.</td><td>Engineering manageri, tech leads</td><td>Treci spre project management sau engineering management.</td></tr>
        <tr><td>Data analyst (junior)</td><td>Rapoartele simple se generează tot mai des cu AI, direct din date.</td><td>Product manageri, unelte AI</td><td>Statistică și înțelegerea business-ului, sau trecere spre data engineering.</td></tr>
      </tbody>
    </table>
  </div>
</section>

<section id="testare">
  <div style="display:grid;gap:10px">
    <p class="eyebrow">Cea mai vizibilă schimbare</p>
    <h2>Testarea făcută de developeri</h2>
    <p class="lead">Înainte, developerul scria codul, iar echipa de testare îl verifica la final. Acum, developerii scriu o mare parte din teste, iar acestea rulează automat la fiecare modificare de cod. Testerii care rămân se ocupă mai ales de automatizare, de strategia de testare și de testarea exploratorie.</p>
  </div>
  <div class="compare">
    <div class="flow">
      <h3>Înainte</h3>
      <div class="steps"><span class="who-dev">Developerul scrie codul</span><em>→</em><span class="who-qa">QA testează manual, la final</span><em>→</em><span>Bugurile apar târziu</span><em>→</em><span class="who-dev">Developerul repară</span><em>→</em><span>Release-uri rare</span></div>
      <p style="color:var(--muted);font-size:.95rem">Bugurile erau găsite după săptămâni și erau mai greu de reparat.</p>
    </div>
    <div class="flow">
      <h3>Acum</h3>
      <div class="steps"><span class="who-dev">Developerul scrie codul și testele</span><em>→</em><span>Testele rulează automat (CI)</span><em>→</em><span class="who-qa">QA automatizează testele end-to-end</span><em>→</em><span>Release-uri dese și mici</span></div>
      <p style="color:var(--muted);font-size:.95rem">Abordarea se numește „shift-left”: testarea se face mai devreme în procesul de dezvoltare.</p>
    </div>
  </div>
  <div class="tablewrap">
    <table>
      <thead><tr><th>Tip de test</th><th>Ce verifică (exemplu)</th><th>Cine îl face de obicei</th></tr></thead>
      <tbody>
        <tr><td>Unit test</td><td>Funcția care calculează costul livrării returnează valoarea corectă pentru 3 km.</td><td><span class="who d">Developer</span></td></tr>
        <tr><td>Test de integrare</td><td>Comanda este salvată corect în baza de date și trimisă restaurantului.</td><td><span class="who d">Developer</span><span class="who q">QA automation</span></td></tr>
        <tr><td>End-to-end</td><td>Un script automat deschide aplicația, adaugă un produs în coș, plătește și verifică confirmarea.</td><td><span class="who q">QA automation</span><span class="who d">Developer</span></td></tr>
        <tr><td>Exploratoriu</td><td>Ce se întâmplă dacă aplicația este închisă în timpul plății sau dacă se adaugă 400 de produse în coș.</td><td><span class="who q">QA</span></td></tr>
        <tr><td>Performanță</td><td>Aplicația funcționează normal când 50.000 de utilizatori comandă în același timp.</td><td><span class="who q">QA</span><span class="who a">SRE</span></td></tr>
        <tr><td>Securitate</td><td>Un utilizator nu poate vedea comenzile altui utilizator modificând un ID din adresă.</td><td><span class="who s">Securitate</span><span class="who d">Developer</span></td></tr>
      </tbody>
    </table>
  </div>
</section>

<section id="tehnologii">
  <div style="display:grid;gap:10px">
    <h2>Tehnologii, pe scurt</h2>
    <p class="lead">Numele care apar des în anunțurile de job, grupate după ce fac. Apasă pe o categorie ca s-o deschizi. Sunt exemple frecvente, nu o listă completă: pentru aproape fiecare categorie există mai multe variante, iar fiecare firmă alege una sau câteva.</p>
    <label for="tq" class="eyebrow" style="margin-top:6px">Caută o tehnologie</label>
    <div class="row" style="gap:10px"><input id="tq" type="search" placeholder="ex. Docker, Terraform, React" style="font:inherit;width:100%;max-width:360px;padding:9px 13px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)"><button type="button" class="chip" id="tAll">Deschide tot</button><button type="button" class="chip" id="tNone">Închide tot</button></div>
  </div>
  <div class="techcats" id="techcats"></div>
</section>

<section id="tendinte">
  <div style="display:grid;gap:10px">
    <p class="eyebrow">Situația în 2026</p>
    <h2>Tendințe actuale</h2>
  </div>
  <div class="trends">
    <div class="trend"><h3>AI în munca de zi cu zi</h3><p>Developerii folosesc asistenți de cod (de exemplu Claude Code, GitHub Copilot sau Cursor) care scriu o parte mare din cod. Munca se mută spre verificarea codului, decizii tehnice și testare.</p><p class="so">Fundamentele rămân necesare: codul generat trebuie înțeles și verificat.</p></div>
    <div class="trend"><h3>Testarea trece la developeri</h3><p>Developerii răspund de testele propriului cod. Rolul de QA se mută spre automatizare și strategie de testare.</p><p class="so">Pentru QA, automatizarea a devenit cerință de bază.</p></div>
    <div class="trend"><h3>Securitate integrată în dezvoltare</h3><p>Verificările de securitate rulează automat la fiecare modificare de cod, nu doar la audituri periodice. Abordarea se numește DevSecOps.</p><p class="so">Orice developer trebuie să cunoască vulnerabilitățile de bază (OWASP Top 10).</p></div>
    <div class="trend"><h3>Platform engineering</h3><p>O echipă dedicată construiește o platformă internă prin care developerii își fac singuri deploy-ul, fără să configureze infrastructura de la zero.</p><p class="so">Este o evoluție a rolului de DevOps.</p></div>
    <div class="trend"><h3>Roluri mai largi</h3><p>Firmele caută oameni specializați pe o arie, dar cu cunoștințe de bază în ariile apropiate. Granițele dintre frontend și backend, sau dintre dezvoltare și testare, sunt tot mai mici.</p><p class="so">Rolurile foarte înguste au tot mai puține posturi.</p></div>
    <div class="trend"><h3>Reglementări noi</h3><p>GDPR, directiva NIS2 și AI Act obligă firmele să demonstreze că protejează datele și folosesc AI în mod responsabil.</p><p class="so">Crește cererea pentru securitate și conformitate (GRC).</p></div>
  </div>
</section>

<section id="crestere">
  <div style="display:grid;gap:10px">
    <p class="eyebrow">Valabil pentru majoritatea rolurilor</p>
    <h2>Niveluri de experiență</h2>
    <p class="lead">Nivelurile au aceleași denumiri în aproape toate rolurile. Diferența dintre ele este mărimea problemelor pe care le poți rezolva singur. Anii sunt orientativi.</p>
  </div>
  <div class="ladder">
    <div class="step"><span class="yrs">0 - 1 ani</span><b>Intern / Junior</b><p>Lucrezi pe task-uri clare și mici, cu îndrumare. Înveți procesul echipei: Git, code review, Jira.</p></div>
    <div class="step"><span class="yrs">2 - 4 ani</span><b>Mid</b><p>Implementezi singur un feature complet.</p></div>
    <div class="step"><span class="yrs">4+ ani</span><b>Senior</b><p>Alegi soluțiile tehnice, anticipezi riscurile și îi ajuți pe colegii mai noi.</p></div>
    <div class="step" style="align-content:center"><b>După senior</b><p>Urmează fie o direcție tehnică, fie una de management.</p></div>
    <div class="fork">
      <div class="step"><b>Direcția tehnică</b><p>Staff / Principal engineer, Software architect. Decizii tehnice pentru mai multe echipe.</p></div>
      <div class="step"><b>Direcția de management</b><p>Tech lead, apoi Engineering manager. Echipa, procesele, angajările.</p></div>
    </div>
  </div>
</section>

<section id="glosar">
  <div style="display:grid;gap:10px">
    <h2>Glosar</h2>
    <p class="lead">Termeni folosiți des în echipele de IT, pe care un începător nu îi știe neapărat. Apasă pe o categorie ca s-o deschizi. Termenii subliniați din pagină se deschid direct de aici sau din Tehnologii, pe scurt.</p>
    <label for="gq" class="eyebrow" style="margin-top:6px">Caută un termen</label>
    <div class="row" style="gap:10px"><input id="gq" type="search" placeholder="ex. framework, deploy, branch"><button type="button" class="chip" id="gAll">Deschide tot</button><button type="button" class="chip" id="gNone">Închide tot</button></div>
  </div>
  <div class="techcats" id="gloss"></div>
</section>

<section id="start">
  <h2>Cum începi</h2>
  <div class="tips">
    <div class="tip"><h3>Baza comună</h3><p>Git, un limbaj de programare, programarea orientată pe obiecte, algoritmi și structuri de date, baze de date (SQL și noțiuni de NoSQL) și Linux la nivel de bază. Le folosesc aproape toate rolurile tehnice.</p></div>
    <div class="tip"><h3>Proiecte proprii</h3><p>O aplicație mică, publicată online și cu teste, arată mai mult decât o listă de cursuri terminate.</p></div>
    <div class="tip"><h3>Alege o arie, nu un rol exact</h3><p>La început e suficient să știi aria care te interesează. Rolul exact se clarifică după primele proiecte.</p></div>
  </div>
</section>

<footer>Tehnologiile și tendințele sunt cele frecvente în 2026 și diferă de la o firmă la alta. Tendințele indică direcția generală a pieței.</footer>
</div>
</div>

<div class="wrap">

<header class="hero">
  <p class="eyebrow">For people starting out in IT</p>
  <h1>Jobs in <span>IT</span></h1>
  <p class="lead">An overview of the main areas in IT: what each role does, which technologies it uses and how the job market is changing in 2026. The examples use a food delivery app, so it is clear where each role fits in.</p>
</header>

<section id="harta" style="padding-top:8px;border-top:0">
  <div style="display:grid;gap:10px">
    <h2>The main areas</h2>
    <p class="lead">Each block is an area of IT. Click one to see the roles in it.</p>
  </div>
  <div class="appmap" id="appmap"></div>
  <p class="mapnote">Quality and security are drawn vertically because they apply to all the other areas: the interface, the server and the data all need to be tested and secured.</p>
</section>

<section id="roluri">
  <div style="display:grid;gap:10px">
    <h2>The roles</h2>
    <p class="lead">Click a role to see what it does, what the daily work looks like, which technologies it uses (with explanations) and how to get started.</p>
  </div>
  <div class="controls">
    <div class="row" id="famrow"><span class="lbl">Area:</span></div>
    <div class="row" id="likerow"><span class="lbl">I am interested in:</span></div>
    <div class="legend"><span>Trend:</span><span class="pill up">growing</span><span class="pill">stable</span><span class="pill chg">changing</span><span class="pill down">declining</span></div>
    <p class="status" id="status" aria-live="polite"></p>
  </div>
  <div class="grid" id="grid"></div>
</section>

<section id="echipe">
  <div style="display:grid;gap:10px">
    <h2>What a team looks like</h2>
    <p class="lead">Not every company has every role. The smaller the company, the fewer roles it has, and the work of the missing roles is taken over by others, most often by developers. Company sizes are approximate. Click a role to see its details.</p>
  </div>
  <div class="sizes" id="sizes"></div>
  <p class="tnote" style="max-width:75ch">In outsourcing companies, which are very common in Romania, the team is put together for a client's project. It can look like any of the columns above, depending on the contract, and sometimes works together with the client's own people.</p>
</section>

<section id="scadere">
  <div style="display:grid;gap:10px">
    <p class="eyebrow">Worth knowing before you choose</p>
    <h2>Declining roles</h2>
    <p class="lead">Some roles have fewer and fewer new openings, because part of their work is taken over by other roles or automated, including with AI. They do not disappear completely, but they are harder to get into and the requirements have changed.</p>
  </div>
  <div class="tablewrap">
    <table>
      <thead><tr><th>Role</th><th>What is happening</th><th>Who takes over the work</th><th>What you can do</th></tr></thead>
      <tbody>
        <tr><td>Manual tester</td><td>Repetitive tests are automated, and developers write their own tests.</td><td>Developers, QA automation</td><td>Learn test automation (Playwright, API testing) and move towards QA automation.</td></tr>
        <tr><td>UX / UI designer</td><td>Many companies use ready-made design systems and AI tools that generate interfaces. Part of the design work is done by frontend developers and product managers. Junior openings are few.</td><td>Frontend developers, product managers</td><td>Combine design with frontend development or with user research.</td></tr>
        <tr><td>Business analyst</td><td>Requirements are more and more often written directly by the product manager or by developers, with AI helping with documentation.</td><td>Product managers, developers, tech leads</td><td>Specialize in a domain (banking, insurance, healthcare) or move towards product management.</td></tr>
        <tr><td>Product owner</td><td>The role is more and more often merged with the product manager role.</td><td>Product managers</td><td>Learn the strategy and data analysis side of product management.</td></tr>
        <tr><td>Scrum master</td><td>Teams organize their own process, and what remains is taken over by the engineering manager or the tech lead.</td><td>Engineering managers, tech leads</td><td>Move towards project management or engineering management.</td></tr>
        <tr><td>Data analyst (junior)</td><td>Simple reports are more and more often generated with AI, directly from the data.</td><td>Product managers, AI tools</td><td>Statistics and business understanding, or a move towards data engineering.</td></tr>
      </tbody>
    </table>
  </div>
</section>

<section id="testare">
  <div style="display:grid;gap:10px">
    <p class="eyebrow">The most visible change</p>
    <h2>Testing done by developers</h2>
    <p class="lead">In the past, the developer wrote the code and the testing team checked it at the end. Now developers write a large part of the tests, and the tests run automatically on every code change. The testers who remain focus mostly on automation, test strategy and exploratory testing.</p>
  </div>
  <div class="compare">
    <div class="flow">
      <h3>Before</h3>
      <div class="steps"><span class="who-dev">The developer writes the code</span><em>→</em><span class="who-qa">QA tests manually, at the end</span><em>→</em><span>Bugs show up late</span><em>→</em><span class="who-dev">The developer fixes them</span><em>→</em><span>Rare releases</span></div>
      <p style="color:var(--muted);font-size:.95rem">Bugs were found weeks later and were harder to fix.</p>
    </div>
    <div class="flow">
      <h3>Now</h3>
      <div class="steps"><span class="who-dev">The developer writes the code and the tests</span><em>→</em><span>Tests run automatically (CI)</span><em>→</em><span class="who-qa">QA automates end-to-end tests</span><em>→</em><span>Frequent, small releases</span></div>
      <p style="color:var(--muted);font-size:.95rem">This approach is called "shift-left": testing happens earlier in the development process.</p>
    </div>
  </div>
  <div class="tablewrap">
    <table>
      <thead><tr><th>Type of test</th><th>What it checks (example)</th><th>Who usually does it</th></tr></thead>
      <tbody>
        <tr><td>Unit test</td><td>The function that calculates the delivery cost returns the correct value for 3 km.</td><td><span class="who d">Developer</span></td></tr>
        <tr><td>Integration test</td><td>The order is saved correctly in the database and sent to the restaurant.</td><td><span class="who d">Developer</span><span class="who q">QA automation</span></td></tr>

<section id="tendinte">
  <div style="display:grid;gap:10px">
    <p class="eyebrow">The situation in 2026</p>
    <h2>Current trends</h2>
  </div>
  <div class="trends">
    <div class="trend"><h3>AI in daily work</h3><p>Developers use coding assistants (for example Claude Code, GitHub Copilot or Cursor) that write a large part of the code. The work is shifting towards reviewing code, making technical decisions and testing.</p><p class="so">The fundamentals are still needed: generated code has to be understood and checked.</p></div>
    <div class="trend"><h3>Testing moves to developers</h3><p>Developers are responsible for testing their own code. The QA role is shifting towards automation and test strategy.</p><p class="so">For QA, automation has become a basic requirement.</p></div>
    <div class="trend"><h3>Security built into development</h3><p>Security checks run automatically on every code change, not only during periodic audits. This approach is called DevSecOps.</p><p class="so">Every developer needs to know the basic vulnerabilities (OWASP Top 10).</p></div>
    <div class="trend"><h3>Platform engineering</h3><p>A dedicated team builds an internal platform that lets developers deploy on their own, without setting up infrastructure from scratch.</p><p class="so">It is an evolution of the DevOps role.</p></div>
    <div class="trend"><h3>Broader roles</h3><p>Companies look for people who specialize in one area but have basic knowledge of the neighboring areas. The lines between frontend and backend, or between development and testing, keep getting thinner.</p><p class="so">Very narrow roles have fewer and fewer openings.</p></div>
    <div class="trend"><h3>New regulations</h3><p>GDPR, the NIS2 directive and the AI Act require companies to show that they protect data and use AI responsibly.</p><p class="so">Demand for security and compliance (GRC) is growing.</p></div>
  </div>
</section>

<section id="crestere">
  <div style="display:grid;gap:10px">
    <p class="eyebrow">Applies to most roles</p>
    <h2>Experience levels</h2>
    <p class="lead">The levels have the same names in almost every role. The difference between them is the size of the problems you can solve on your own. The years are approximate.</p>
  </div>
  <div class="ladder">
    <div class="step"><span class="yrs">0 - 1 years</span><b>Intern / Junior</b><p>You work on small, clear tasks, with guidance. You learn how the team works: Git, code review, Jira.</p></div>
    <div class="step"><span class="yrs">2 - 4 years</span><b>Mid</b><p>You build a complete feature on your own.</p></div>
    <div class="step"><span class="yrs">4+ years</span><b>Senior</b><p>You choose the technical solutions, anticipate risks and help newer colleagues.</p></div>
    <div class="step" style="align-content:center"><b>After senior</b><p>Next comes either a technical track or a management track.</p></div>
    <div class="fork">
      <div class="step"><b>Technical track</b><p>Staff / Principal engineer, Software architect. Technical decisions across several teams.</p></div>
      <div class="step"><b>Management track</b><p>Tech lead, then Engineering manager. The team, the processes, hiring.</p></div>
    </div>
  </div>
</section>

function app(D,signal){
const {FAM,FAM_ORDER,LIKES,T,R,TK,GL,TECH,ASPECTS,SIZES,UI,TOCL}=D;

const TD={},AL={};
GL.forEach(([cat,l])=>l.forEach(([k,d,al])=>{TD[k]={d,cat,sec:"glosar"};[k,...(al||[])].forEach(a=>AL[a]=k);}));
TECH.forEach(([cat,l])=>l.forEach(([k,d,al])=>{TD[k]={d,cat,sec:"tehnologii"};[k,...(al||[])].forEach(a=>AL[a]=k);}));
const TRE=new RegExp("(^|[^\\p{L}\\p{N}_])("+Object.keys(AL).sort((a,b)=>b.length-a.length).map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")(?![\\p{L}\\p{N}_+#])","gu");
function lk(t,self){
  let out="",i=0,m;const seen=new Set();TRE.lastIndex=0;
  while((m=TRE.exec(t))){
    const s=m.index+m[1].length,term=m[2],k=AL[term];
    out+=esc(t.slice(i,s));
    out+=(k===self||seen.has(k)||!seen.add(k))?esc(term):`<button type="button" class="tk" data-k="${esc(k)}">${esc(term)}</button>`;
    i=s+term.length;TRE.lastIndex=i;
  }
  return out+esc(t.slice(i));
}
const st={fam:null,likes:new Set()};

function render(){
  famrow.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",String((c.dataset.f||null)===st.fam)));
  map.querySelectorAll(".band").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.f===st.fam)));
  likerow.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",String(st.likes.has(c.dataset.k))));
  let list=R.filter(r=>!st.fam||r.f===st.fam).map(r=>({r,m:r.l.filter(x=>st.likes.has(x)).length}));
  if(st.likes.size)list.sort((a,b)=>b.m-a.m);
  const g=$("#grid");g.innerHTML="";
  list.forEach(({r,m})=>{
    const c=document.createElement("button");c.className="card"+(st.likes.size&&!m?" dim":"");c.style.cssText=fc(r.f);
    const [tl,tc]=T[r.t];
    c.innerHTML=`<div class="top"><span class="fam"><i></i>${esc(FAM[r.f].n)}</span></div><h3>${esc(r.n)}</h3><p>${esc(r.s)}</p><div class="meta"><span class="pill ${tc}">${tl}</span><span class="pill">${r.e?UI.entryYes:UI.entryNo}</span></div>`;

  markSubs();
}

const pop=document.createElement("div");pop.id="pop";pop.hidden=true;pop.setAttribute("role","dialog");
function showPop(b){
  const k=b.dataset.k,t=TD[k];if(!t)return;
  const inDlg=dlg.contains(b),host=inDlg?dlg:$("#root");
  pop.innerHTML=`<div class="pop-h"><span class="eyebrow">${esc(t.cat)}</span><button type="button" class="pop-x" aria-label="${esc(UI.close)}">×</button></div><b>${esc(k)}</b><p>${lk(t.d,k)}</p><button type="button" class="pop-go">${esc(UI.seeIn(t.sec))}</button>`;
  pop.querySelector(".pop-x").onclick=hidePop;
  pop.querySelector(".pop-go").onclick=()=>goTo(k);
  host.appendChild(pop);pop.hidden=false;
  const r=b.getBoundingClientRect(),w=pop.offsetWidth;
  if(inDlg){const d=dlg.getBoundingClientRect();
    pop.style.top=(r.bottom-d.top+dlg.scrollTop+6)+"px";
    pop.style.left=Math.max(8,Math.min(r.left-d.left,d.width-w-8))+"px";
  }else{
    pop.style.top=(r.bottom+window.scrollY+6)+"px";
    pop.style.left=Math.max(8,Math.min(r.left+window.scrollX,document.documentElement.clientWidth-w-8))+"px";
  }
}
function hidePop(){pop.hidden=true;}
function goTo(k){
  hidePop();if(dlg.open)dlg.close();
  if(TD[k].sec==="glosar"){$("#gq").value="";renderGl();}else{$("#tq").value="";renderTech();}
  const el=[...document.querySelectorAll("[data-term]")].find(x=>x.dataset.term===k);
  if(!el)return;
  const dt=el.closest("details");if(dt)openCat(dt.id);
  el.scrollIntoView({block:"center"});
  el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash");
}
on(document,"click",e=>{

},{capture:true});

const OPEN=new Set();

function closeSiblings(d){d.parentElement.querySelectorAll("details.techcat[open]").forEach(x=>{if(x!==d){x.open=false;OPEN.delete(x.id);}});}

function cats(arr,pre,q){
  q=q.trim().toLowerCase();
  return arr.map(([cat,l],ci)=>{
    const items=l.filter(([k,v,al])=>!q||[k,...(al||[])].some(x=>x.toLowerCase().includes(q))||v.toLowerCase().includes(q));
    if(!items.length)return"";
    const id=pre+"-"+ci,open=q||OPEN.has(id);
    return `<details class="techcat" id="${id}"${open?" open":""}><summary><span class="sh"><h3>${esc(cat)}</h3><span class="cnt">${items.length}</span></span><span class="prev">${esc(items.slice(0,6).map(x=>x[0]).join(", "))}${items.length>6?", ...":""}</span></summary><ul class="techlist">${items.map(([k,v])=>`<li data-term="${esc(k)}"><code>${esc(k)}</code><span>${lk(v,k)}</span></li>`).join("")}</ul></details>`;
  }).join("");
}
function renderTech(q=$("#tq").value){$("#techcats").innerHTML=cats(TECH,"t",q)||`<p class="lead">${esc(UI.noTech(q.trim()))}</p>`;markSubs();}
function renderGl(q=$("#gq").value){$("#gloss").innerHTML=cats(GL,"g",q)||`<p class="lead">${esc(UI.noTerm(q.trim()))}</p>`;markSubs();}
$("#tq").addEventListener("input",e=>renderTech(e.target.value));
$("#gq").addEventListener("input",e=>renderGl(e.target.value));
$("#tAll").onclick=()=>setAll("t",TECH,true);$("#tNone").onclick=()=>setAll("t",TECH,false);
$("#gAll").onclick=()=>setAll("g",GL,true);$("#gNone").onclick=()=>setAll("g",GL,false);
renderTech();renderGl();render();

$("#sizes").innerHTML=SIZES.map(([n,sz,rows])=>`<div class="size"><div class="size-h"><h3>${esc(n)}</h3><span class="eyebrow">${esc(sz)}</span></div>${rows.map(([ids,t],i)=>`<div class="cell"><span class="asp">${esc(ASPECTS[i])}</span>${ids.length?`<div class="links">${ids.map(id=>`<button type="button" class="rchip" data-id="${id}" style="${fc(byId[id].f)}"><i></i>${esc(byId[id].n)}</button>`).join("")}</div>`:`<span class="none">${esc(UI.noRole)}</span>`}<p>${esc(t)}</p></div>`).join("")}</div>`).join("");
document.querySelectorAll("#echipe .rchip").forEach(b=>b.onclick=()=>openRole(b.dataset.id));

const TOC=[["harta"],["roluri",()=>FAM_ORDER.map(f=>[FAM[f].n,null])],["echipe"],["scadere"],["testare"],
 ["tehnologii",()=>TECH.map(([c],i)=>[c,"t-"+i])],["tendinte"],["crestere"],["glosar",()=>GL.map(([c],i)=>[c,"g-"+i])],["start"]];
const tocEl=$("#toc");
tocEl.innerHTML=TOC.map(([id,sub])=>`<li data-sec="${id}"><a href="#${id}">${esc(TOCL[id])}</a>${sub?`<ol class="sub">${sub().map(([sn,t],j)=>t?`<li><a href="#${t}">${esc(sn)}</a></li>`:`<li><a href="#roluri" data-fam="${j}">${esc(sn)}</a></li>`).join("")}</ol>`:""}</li>`).join("");
tocEl.querySelectorAll('a[href^="#t-"],a[href^="#g-"]').forEach(a=>a.addEventListener("click",()=>openCat(a.getAttribute("href").slice(1))));
tocEl.querySelectorAll("[data-fam]").forEach(a=>a.onclick=e=>{e.preventDefault();st.fam=FAM_ORDER[+a.dataset.fam];render();document.getElementById("roluri").scrollIntoView();});
document.querySelectorAll('#toc li[data-sec="roluri"] > a, nav.top a[href="#roluri"]').forEach(a=>a.addEventListener("click",()=>{st.fam=null;st.likes.clear();render();}));
document.querySelectorAll('#toc li[data-sec="tehnologii"] > a, nav.top a[href="#tehnologii"]').forEach(a=>a.addEventListener("click",()=>{$("#tq").value="";setAll("t",TECH,false);renderTech();}));
document.querySelectorAll('#toc li[data-sec="glosar"] > a, nav.top a[href="#glosar"]').forEach(a=>a.addEventListener("click",()=>{$("#gq").value="";setAll("g",GL,false);renderGl();}));
const secs=TOC.map(([id])=>document.getElementById(id));
let tocRaf=0,tocLock=null;
function setOn(id){tocEl.querySelectorAll(":scope > li").forEach(li=>li.classList.toggle("on",li.dataset.sec===id));}
function tocActive(){tocRaf=0;if(tocLock)return setOn(tocLock);
  let cur=secs[0];for(const el of secs){if(el.getBoundingClientRect().top<140)cur=el;}
  if(innerHeight+scrollY>=document.documentElement.scrollHeight-4)cur=secs[secs.length-1];
  setOn(cur.id);}
tocEl.querySelectorAll(":scope > li").forEach(li=>li.addEventListener("click",()=>{tocLock=li.dataset.sec;setOn(tocLock);}));
["wheel","touchstart","keydown"].forEach(ev=>on(window,ev,()=>{tocLock=null;},{passive:true}));
on(window,"scroll",()=>{if(!tocRaf)tocRaf=requestAnimationFrame(tocActive);},{passive:true});
tocActive();markSubs();
const tbox=$("#tocbox"),tbg=$(".toc-bg"),mbtn=$(".menu-btn");
function drawer(v){tbox.classList.toggle("open",v);tbg.hidden=!v;mbtn.setAttribute("aria-expanded",String(v));}
mbtn.onclick=()=>drawer(!tbox.classList.contains("open"));
tbg.onclick=()=>drawer(false);
tbox.addEventListener("click",e=>{if(e.target.closest("a")&&innerWidth<1180)drawer(false);});
on(document,"keydown",e=>{if(e.key==="Escape"&&tbox.classList.contains("open"))drawer(false);});
}

let ac=null;
function mount(lang){
  if(!DATA[lang])lang="ro";
  if(ac)ac.abort();
  const dlg=document.getElementById("dlg");if(dlg&&dlg.open)dlg.close();
  const root=document.getElementById("root");
  root.innerHTML="";root.appendChild(document.getElementById("tpl-"+lang).content.cloneNode(true));
  document.documentElement.lang=lang;document.title=DATA[lang].UI.title;
  root.querySelectorAll("[data-setlang]").forEach(b=>{b.setAttribute("aria-pressed",String(b.dataset.setlang===lang));b.onclick=()=>{if(b.dataset.setlang!==lang){try{localStorage.setItem("lang",b.dataset.setlang)}catch(e){}mount(b.dataset.setlang);}};});
  root.querySelectorAll(".theme-btn").forEach(b=>b.onclick=()=>{
    const cur=document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
    const nx=cur==="dark"?"light":"dark";document.documentElement.dataset.theme=nx;try{localStorage.setItem("theme",nx)}catch(e){}});
  ac=new AbortController();
  app(DATA[lang],ac.signal);
}
try{const th=localStorage.getItem("theme");if(th)document.documentElement.dataset.theme=th;}catch(e){}
let startLang="ro";try{startLang=localStorage.getItem("lang")||"ro";}catch(e){}
mount(startLang);

</script>
</body>
</html>
